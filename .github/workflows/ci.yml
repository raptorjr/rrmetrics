name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript checks and reconstruction tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate package lock for dependency verification
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-parquet-package-lock
          path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Build client
        run: npm run build

      - name: Run tests
        run: npm test
