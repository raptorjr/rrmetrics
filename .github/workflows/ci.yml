name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript checks and reconstruction tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Parquet libraries for local sample verification
        run: tar -czf /tmp/parquet-runtime-libraries.tgz -C node_modules hyparquet hyparquet-writer hyparquet-compressors fzstd hysnappy

      - name: Upload Parquet library bundle
        uses: actions/upload-artifact@v4
        with:
          name: parquet-runtime-libraries
          path: /tmp/parquet-runtime-libraries.tgz
          retention-days: 1

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Build client
        run: npm run build

      - name: Run tests
        run: npm test
