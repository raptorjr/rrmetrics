name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript checks and reconstruction tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci



      - name: Bundle trade-tick services for real Parquet smoke test
        run: tar -czf /tmp/trade-tick-service-smoke.tgz -C node_modules hyparquet hyparquet-writer hyparquet-compressors fzstd hysnappy typescript -C .. server/src/services/market-data-ticks.ts server/src/services/market-data-time.ts

      - name: Upload trade-tick service smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: trade-tick-service-smoke
          path: /tmp/trade-tick-service-smoke.tgz
          retention-days: 1

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Build client
        run: npm run build

      - name: Run tests
        run: npm test
